name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @seba174/ngx-loading-buttons
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test library
        run: npm run test:ngx-loading-buttons

      - name: Build library
        run: npm run build:ngx-loading-buttons

      - name: Show package contents
        run: npm pack ./dist/ngx-loading-buttons --dry-run

      - name: Publish package
        run: npm publish ./dist/ngx-loading-buttons --access public
